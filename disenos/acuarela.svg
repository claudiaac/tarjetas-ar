<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FAEE0"/><stop offset="0.55" stop-color="#B9DAF2"/><stop offset="1" stop-color="#FCE7D2"/>
    </linearGradient>
    <linearGradient id="loma1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ACB7A"/><stop offset="1" stop-color="#6FA85A"/></linearGradient>
    <linearGradient id="loma2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DB86A"/><stop offset="1" stop-color="#4F8E48"/></linearGradient>
    <filter id="acuarela" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
    </filter>
    <radialGradient id="halo"><stop offset="0.45" stop-color="#FFF6D6" stop-opacity="0.9"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></radialGradient>
    <filter id="papel">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.10 0"/>
    </filter>
    <g id="nube">
      <circle cx="0" cy="0" r="60"/><circle cx="70" cy="-30" r="80"/><circle cx="160" cy="-10" r="70"/>
      <circle cx="230" cy="20" r="50"/><circle cx="110" cy="40" r="60"/><circle cx="30" cy="40" r="45"/>
    </g>
  </defs>
  <rect width="1000" height="1000" fill="url(#cielo)"/>

  <!-- sol -->
  <circle cx="790" cy="190" r="120" fill="url(#halo)"/>
  <circle cx="790" cy="190" r="62" fill="#FFE08A"/>

  <!-- nubes grandes -->
  <g filter="url(#acuarela)">
    <g transform="translate(70,230) scale(1.25)" fill="#FFFFFF"><use href="#nube"/></g>
    <g transform="translate(90,250) scale(1.25)" fill="#D6E6F5" opacity="0.6"><circle cx="110" cy="60" r="55"/><circle cx="200" cy="40" r="45"/></g>
    <g transform="translate(560,330) scale(0.9)" fill="#FFFFFF"><use href="#nube"/></g>
    <g transform="translate(380,110) scale(0.55)" fill="#FFFFFF" opacity="0.9"><use href="#nube"/></g>
  </g>
  <!-- pajaritos -->
  <g stroke="#3D5A80" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M610,120 q14,-14 28,0 q14,-14 28,0"/><path d="M680,85 q10,-10 20,0 q10,-10 20,0"/><path d="M560,170 q9,-9 18,0 q9,-9 18,0"/>
  </g>

  <!-- lomas -->
  <g filter="url(#acuarela)">
    <path d="M-20,600 C150,520 300,540 450,580 C600,620 760,520 1020,560 L1020,1020 L-20,1020 Z" fill="#B5D69A"/>
    <path d="M-20,690 C180,620 360,640 520,690 C680,740 820,650 1020,680 L1020,1020 L-20,1020 Z" fill="url(#loma1)"/>
    <path d="M-20,820 C200,760 420,790 600,830 C760,865 880,800 1020,810 L1020,1020 L-20,1020 Z" fill="url(#loma2)"/>
  </g>

  <!-- casita -->
  <g transform="translate(640,520)">
    <rect x="0" y="40" width="130" height="95" fill="#FFF4E0" stroke="#8C6A4A" stroke-width="5"/>
    <path d="M-18,48 L65,-25 L148,48 Z" fill="#D9604C" stroke="#9E3E30" stroke-width="5" stroke-linejoin="round"/>
    <rect x="22" y="70" width="32" height="30" fill="#8EC5F0" stroke="#8C6A4A" stroke-width="4"/>
    <line x1="38" y1="70" x2="38" y2="100" stroke="#8C6A4A" stroke-width="3"/>
    <rect x="78" y="80" width="30" height="55" fill="#A9744F" stroke="#8C6A4A" stroke-width="4"/>
    <rect x="95" y="-10" width="18" height="34" fill="#9E3E30"/>
  </g>
  <!-- humo -->
  <g fill="#FFFFFF" opacity="0.8"><circle cx="745" cy="485" r="12"/><circle cx="760" cy="460" r="16"/><circle cx="782" cy="430" r="20"/></g>

  <!-- camino -->
  <path d="M705,655 C690,700 600,720 560,760 C510,810 520,880 470,1000 L560,1000 C590,900 580,830 620,790 C660,750 730,720 735,655 Z" fill="#E9D3A8" filter="url(#acuarela)"/>

  <!-- árbol grande -->
  <path d="M200,800 C205,720 195,640 215,560 L245,560 C255,640 250,720 262,800 Z" fill="#7A5236"/>
  <path d="M228,620 C200,600 175,590 150,592 M238,600 C265,580 290,575 310,580" stroke="#7A5236" stroke-width="14" stroke-linecap="round" fill="none"/>
  <g filter="url(#acuarela)">
    <circle cx="230" cy="470" r="135" fill="#4F8E48"/>
    <circle cx="140" cy="540" r="90" fill="#5C9C4F"/>
    <circle cx="330" cy="540" r="95" fill="#5C9C4F"/>
    <circle cx="210" cy="420" r="90" fill="#6FAE5C"/>
    <circle cx="290" cy="450" r="70" fill="#7DBB66"/>
  </g>
  <g fill="#E8667A"><circle cx="180" cy="460" r="12"/><circle cx="280" cy="420" r="11"/><circle cx="320" cy="520" r="12"/><circle cx="150" cy="560" r="10"/><circle cx="240" cy="520" r="11"/></g>

  <!-- globos atados al árbol -->
  <g stroke="#555" stroke-width="3" fill="none"><path d="M300,585 C330,520 360,450 380,380"/><path d="M300,585 C340,530 400,470 440,420"/><path d="M300,585 C320,520 330,460 335,410"/></g>
  <ellipse cx="380" cy="345" rx="34" ry="42" fill="#F28C8C"/><ellipse cx="440" cy="385" rx="30" ry="38" fill="#F7D37A"/><ellipse cx="335" cy="375" rx="28" ry="35" fill="#8EC5F0"/>
  <g fill="#fff" opacity="0.6"><ellipse cx="370" cy="330" rx="8" ry="12"/><ellipse cx="432" cy="372" rx="7" ry="10"/><ellipse cx="327" cy="362" rx="6" ry="9"/></g>

  <!-- mantel de picnic con pastel -->
  <g transform="translate(300,800)">
    <path d="M-120,40 L230,10 L290,110 L-80,140 Z" fill="#F3B7B7"/>
    <g stroke="#E06D6D" stroke-width="10" opacity="0.7">
      <line x1="-100" y1="70" x2="250" y2="40"/><line x1="-90" y1="105" x2="270" y2="75"/>
      <line x1="-40" y1="35" x2="-10" y2="135"/><line x1="40" y1="28" x2="70" y2="128"/><line x1="120" y1="22" x2="150" y2="120"/><line x1="195" y1="15" x2="225" y2="113"/>
    </g>
    <ellipse cx="80" cy="60" rx="70" ry="18" fill="#FFFFFF"/>
    <rect x="25" y="0" width="110" height="58" rx="10" fill="#FFF4E0" stroke="#C9956A" stroke-width="4"/>
    <path d="M25,15 Q40,30 55,15 Q70,30 85,15 Q100,30 115,15 Q125,28 135,15 L135,5 Q80,-8 25,5 Z" fill="#F28C8C"/>
    <rect x="58" y="-38" width="9" height="36" fill="#8EC5F0"/><rect x="92" y="-38" width="9" height="36" fill="#F7D37A"/>
    <path d="M62,-55 q8,10 0,16 q-8,-6 0,-16Z M96,-55 q8,10 0,16 q-8,-6 0,-16Z" fill="#FFB347"/>
  </g>

  <!-- flores del pasto -->
  <g>
    <circle cx="80" cy="900" r="10" fill="#FFFFFF"/><circle cx="80" cy="900" r="4" fill="#F7D37A"/>
    <circle cx="140" cy="950" r="9" fill="#F28C8C"/><circle cx="620" cy="930" r="10" fill="#FFFFFF"/><circle cx="620" cy="930" r="4" fill="#F7D37A"/>
    <circle cx="700" cy="880" r="9" fill="#B69CFF"/><circle cx="860" cy="930" r="11" fill="#FFFFFF"/><circle cx="860" cy="930" r="4" fill="#F7D37A"/>
    <circle cx="930" cy="870" r="8" fill="#F28C8C"/><circle cx="40" cy="790" r="8" fill="#B69CFF"/><circle cx="900" cy="760" r="9" fill="#FFFFFF"/>
    <circle cx="420" cy="720" r="8" fill="#F7D37A"/><circle cx="520" cy="680" r="7" fill="#FFFFFF"/>
  </g>
  <rect width="1000" height="1000" filter="url(#papel)"/>
</svg>
