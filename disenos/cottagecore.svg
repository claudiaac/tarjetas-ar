  <rect x="440" y="380" width="16" height="80" rx="4" fill="#F2A1B5" stroke="#C9728A" stroke-width="3"/>
  <rect x="544" y="380" width="16" height="80" rx="4" fill="#9FC9EB" stroke="#6F9FC4" stroke-width="3"/>
  <path d="M448,340 q16,22 0,34 q-16,-12 0,-34Z M552,340 q16,22 0,34 q-16,-12 0,-34Z" fill="#F2C14E" stroke="#D99A2B" stroke-width="2"/>
  <!-- banderín -->
  <path d="M250,300 Q500,370 750,300" stroke="#8C6A4A" stroke-width="3" fill="none"/>
  <g stroke="#8C6A4A" stroke-width="2">
    <path d="M280,309 L330,322 L298,365 Z" fill="#E0474C"/><path d="M345,325 L395,336 L365,380 Z" fill="#F2C14E"/>
    <path d="M410,338 L460,344 L433,390 Z" fill="#7DA86A"/><path d="M475,345 L525,345 L500,392 Z" fill="#9FC9EB"/>
    <path d="M540,344 L590,338 L567,390 Z" fill="#F2A1B5"/><path d="M605,336 L655,325 L635,380 Z" fill="#E0474C"/>
    <path d="M670,322 L720,309 L702,365 Z" fill="#F2C14E"/>
  </g>

