    <use href="#hoja" transform="translate(830,80) rotate(160)"/><use href="#hoja" transform="translate(930,170) rotate(120)"/>
    <use href="#hoja" transform="translate(40,880) rotate(-60)"/><use href="#hoja" transform="translate(920,900) rotate(-130)"/>
    <use href="#hoja" transform="translate(420,60) rotate(-10)"/><use href="#hoja" transform="translate(620,50) rotate(190)"/>
  </g>
  <use href="#margarita" transform="translate(110,100)"/>
  <use href="#margarita" transform="translate(880,120) scale(1.2)"/>
  <use href="#margarita" transform="translate(500,70) scale(0.8)"/>
  <use href="#margarita" transform="translate(70,480) scale(0.9)"/>
  <use href="#margarita" transform="translate(940,470)"/>
  <use href="#margarita" transform="translate(860,880) scale(1.1)"/>
