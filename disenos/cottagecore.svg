        <ellipse cx="0" cy="-22" rx="10" ry="20"/><ellipse cx="0" cy="22" rx="10" ry="20"/><ellipse cx="-22" cy="0" rx="20" ry="10"/><ellipse cx="22" cy="0" rx="20" ry="10"/>
        <ellipse cx="-16" cy="-16" rx="9" ry="18" transform="rotate(-45 -16 -16)"/><ellipse cx="16" cy="16" rx="9" ry="18" transform="rotate(-45 16 16)"/>
        <ellipse cx="16" cy="-16" rx="9" ry="18" transform="rotate(45 16 -16)"/><ellipse cx="-16" cy="16" rx="9" ry="18" transform="rotate(45 -16 16)"/>
      </g>
      <circle r="11" fill="#F2C14E" stroke="#D99A2B" stroke-width="2"/>
    </g>
    <g id="hongo">
      <path d="M-14,0 C-16,30 -12,55 -18,70 L18,70 C12,55 16,30 14,0 Z" fill="#F7EBD3" stroke="#B89B72" stroke-width="3"/>
      <path d="M-60,5 C-60,-50 60,-50 60,5 C30,15 -30,15 -60,5 Z" fill="#D9534F" stroke="#A33A36" stroke-width="3"/>
      <g fill="#FFFFFF"><circle cx="-30" cy="-15" r="8"/><circle cx="5" cy="-30" r="7"/><circle cx="32" cy="-12" r="9"/><circle cx="-5" cy="-5" r="5"/></g>
    </g>
    <g id="fresa">
      <path d="M0,-20 C25,-20 30,5 0,30 C-30,5 -25,-20 0,-20 Z" fill="#E0474C" stroke="#B5333A" stroke-width="2"/>
      <path d="M-14,-20 L-6,-28 L0,-20 L6,-28 L14,-20 L0,-14 Z" fill="#6FA85A"/>
      <g fill="#FFE8A3"><circle cx="-8" cy="-6" r="2"/><circle cx="6" cy="-4" r="2"/><circle cx="-2" cy="8" r="2"/><circle cx="8" cy="10" r="2"/><circle cx="-10" cy="6" r="2"/></g>
    </g>
    <g id="hoja"><path d="M0,0 C20,-20 50,-20 60,0 C50,20 20,20 0,0 Z" fill="#7DA86A"/><path d="M0,0 L55,0" stroke="#5C8A4E" stroke-width="2"/></g>
  </defs>
  <rect width="1000" height="1000" fill="url(#vichy)"/>

