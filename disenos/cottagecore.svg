<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <pattern id="vichy" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#F4F1E1"/>
      <rect width="30" height="60" fill="#B9CFA3" opacity="0.45"/>
      <rect width="60" height="30" fill="#B9CFA3" opacity="0.45"/>
    </pattern>
    <g id="margarita">
