  <use href="#hongo" transform="translate(170,760) scale(1.2)"/>
  <use href="#hongo" transform="translate(250,800) scale(0.8)"/>
  <use href="#hongo" transform="translate(830,780) scale(1.0)"/>

  <!-- conejito asomándose -->
  <g transform="translate(800,610)">
    <ellipse cx="-25" cy="-75" rx="16" ry="48" fill="#FFFFFF" stroke="#C9B8A6" stroke-width="4" transform="rotate(-10 -25 -75)"/>
    <ellipse cx="25" cy="-75" rx="16" ry="48" fill="#FFFFFF" stroke="#C9B8A6" stroke-width="4" transform="rotate(10 25 -75)"/>
    <ellipse cx="-25" cy="-72" rx="7" ry="32" fill="#F7C6D0" transform="rotate(-10 -25 -72)"/>
    <ellipse cx="25" cy="-72" rx="7" ry="32" fill="#F7C6D0" transform="rotate(10 25 -72)"/>
    <ellipse cx="0" cy="0" rx="62" ry="54" fill="#FFFFFF" stroke="#C9B8A6" stroke-width="4"/>
    <circle cx="-22" cy="-6" r="7" fill="#3B2A2F"/><circle cx="22" cy="-6" r="7" fill="#3B2A2F"/>
    <ellipse cx="0" cy="10" rx="7" ry="5" fill="#F29BAE"/>
    <ellipse cx="-36" cy="14" rx="11" ry="6" fill="#F7C6D0"/><ellipse cx="36" cy="14" rx="11" ry="6" fill="#F7C6D0"/>
  </g>
  <!-- abejita -->
  <g transform="translate(180,330) rotate(-10)">
    <ellipse cx="-6" cy="-18" rx="14" ry="10" fill="#E6F2FA" stroke="#9FC9EB" stroke-width="2"/><ellipse cx="10" cy="-18" rx="14" ry="10" fill="#E6F2FA" stroke="#9FC9EB" stroke-width="2"/>
    <ellipse rx="26" ry="18" fill="#F2C14E" stroke="#3B2A2F" stroke-width="3"/>
    <path d="M-6,-17 L-6,17 M8,-16 L8,16" stroke="#3B2A2F" stroke-width="6"/>
    <circle cx="18" cy="-3" r="3" fill="#3B2A2F"/>
