  <use href="#fresa" transform="translate(500,490) scale(1.5)"/>
  <use href="#fresa" transform="translate(610,505) scale(1.4) rotate(15)"/>
  <use href="#fresa" transform="translate(445,535) scale(1.1) rotate(-5)"/>
  <use href="#fresa" transform="translate(555,535) scale(1.1) rotate(8)"/>
