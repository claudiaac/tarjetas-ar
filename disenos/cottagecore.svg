  <g fill="#F2A1B5"><circle cx="720" cy="110" r="9"/><circle cx="736" cy="120" r="9"/><circle cx="720" cy="130" r="9"/><circle cx="706" cy="120" r="9"/></g>
  <g fill="#9FC9EB"><circle cx="70" cy="300" r="8"/><circle cx="84" cy="310" r="8"/><circle cx="70" cy="320" r="8"/><circle cx="56" cy="310" r="8"/></g>
  <g fill="#F2A1B5"><circle cx="930" cy="320" r="8"/><circle cx="944" cy="330" r="8"/><circle cx="930" cy="340" r="8"/><circle cx="916" cy="330" r="8"/></g>

  <!-- base de madera -->
  <ellipse cx="500" cy="760" rx="330" ry="70" fill="#C79A6B" stroke="#8C6A4A" stroke-width="5"/>
  <ellipse cx="500" cy="745" rx="310" ry="58" fill="#DDB487"/>
  <path d="M220,745 Q500,790 780,745" stroke="#C79A6B" stroke-width="4" fill="none"/>

  <!-- pastel -->
  <path d="M290,520 L290,700 C290,760 710,760 710,700 L710,520 Z" fill="#F7EBD3" stroke="#B89B72" stroke-width="6"/>
  <!-- capa de mermelada -->
  <path d="M290,610 C290,650 710,650 710,610 L710,635 C710,675 290,675 290,635 Z" fill="#E0474C" opacity="0.85"/>
