  <path d="M487,240 L513,228 M487,270 L513,258 M487,300 L513,288" stroke="#FF7FA3" stroke-width="7"/>
  <path d="M500,130 C530,165 525,200 500,208 C475,200 470,165 500,130 Z" fill="#FFB347" stroke="#F08A24" stroke-width="5"/>
