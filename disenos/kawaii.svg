    <linearGradient id="betun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC2DA"/><stop offset="1" stop-color="#FF8DB8"/></linearGradient>
    <clipPath id="capacillo"><path d="M262,590 L738,590 L690,870 Q500,900 310,870 Z"/></clipPath>
